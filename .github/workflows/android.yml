name: android
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: DSP synthetic tests
        run: ./dsp/test/run_tests.sh
      - name: mucore tests (scoring, tuner, calibration, SPSC)
        run: |
          cmake -S core -B core/build -DCMAKE_BUILD_TYPE=Release
          cmake --build core/build -j
          ./core/build/mucore_tests

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Unit tests + debug APK
        working-directory: android
        run: ./gradlew testDebugUnitTest assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: mu-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
