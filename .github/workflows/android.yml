name: android
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: DSP synthetic tests
        run: ./dsp/test/run_tests.sh
      - name: mucore tests (scoring, tuner, calibration, SPSC)
        run: |
          cmake -S core -B core/build -DCMAKE_BUILD_TYPE=Release
          cmake --build core/build -j
          ./core/build/mucore_tests

  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Unit tests + debug APK
        working-directory: android
        run: ./gradlew testDebugUnitTest assembleDebug --console=plain
      - uses: actions/upload-artifact@v7
        with:
          name: mu-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish rolling prerelease (latest)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk mu-debug.apk
          gh release delete latest --cleanup-tag -y || true
          gh release create latest mu-debug.apk --prerelease --target "$GITHUB_SHA" \
            --title "Mu latest (debug)" \
            --notes "Auto-built debug APK from commit $GITHUB_SHA on main. Not signed for release."
      - name: Publish tagged release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk mu-debug.apk
          gh release create "$GITHUB_REF_NAME" mu-debug.apk --verify-tag \
            --title "Mu $GITHUB_REF_NAME" \
            --notes "Debug APK built from $GITHUB_REF_NAME ($GITHUB_SHA)."
