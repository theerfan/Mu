name: android
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: DSP synthetic tests
        run: ./dsp/test/run_tests.sh
      - name: mucore tests (scoring, tuner, calibration, SPSC)
        run: |
          cmake -S core -B core/build -DCMAKE_BUILD_TYPE=Release
          cmake --build core/build -j
          ./core/build/mucore_tests

  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Unit tests + debug APK
        working-directory: android
        run: ./gradlew testDebugUnitTest assembleDebug --console=plain
      - uses: actions/upload-artifact@v7
        with:
          name: mu-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish rolling release (android)
        # Replaced on every build of main: tag "android" moves to this commit, the asset is always mu.apk, and it is a
        # normal (non-pre) release marked latest, so the repo page's Releases box and
        # https://github.com/theerfan/Mu/releases/latest/download/mu.apk always point at the newest build.
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ver="0.2.${GITHUB_RUN_NUMBER}"
          cp android/app/build/outputs/apk/debug/app-debug.apk mu.apk
          notes="$RUNNER_TEMP/notes.md"
          printf '%s\n' \
            "Debug APK of Mu ${ver} (versionCode $((1 + GITHUB_RUN_NUMBER))), built from ${GITHUB_SHA}." \
            "" \
            "This release is replaced on every push to main; the file is always \`mu.apk\`, so" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/mu.apk always gets the newest build." \
            "Builds share one signing key, so a new APK installs over the old one." > "$notes"
          gh release delete latest --yes --cleanup-tag || true    # the old rolling prerelease
          gh release delete android --yes --cleanup-tag || true
          git push origin :refs/tags/android || true
          for _ in 1 2 3 4 5 6; do
            if gh release create android mu.apk --target "$GITHUB_SHA" --title "Mu ${ver}" --notes-file "$notes" --latest; then
              echo "### Mu ${ver}: https://github.com/${GITHUB_REPOSITORY}/releases/tag/android" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            git push origin :refs/tags/android || true
            sleep 3
          done
          exit 1
      - name: Publish tagged release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk mu-debug.apk
          gh release create "$GITHUB_REF_NAME" mu-debug.apk --verify-tag --latest=false \
            --title "Mu $GITHUB_REF_NAME" \
            --notes "Debug APK built from $GITHUB_REF_NAME ($GITHUB_SHA)."
